name: Upload to Bunny Storage
env:
  environment: "dev"
on:
  push:
    branches: [ all-projects ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18.20.0

      - name: Install dependencies
        run: npm ci

      - name: Build App
        run: npm run build:$environment

      - name: Upload files to Bunny Storage
        uses: ayeressian/bunnycdn-storage-deploy@v2.4.0
        with:
          source: "dist"
          destination: ""
          storageZoneName: arancibia-storage
          storagePassword: "${{ secrets.BUNNY_STORAGE_PASSWORD }}"
          accessKey: "${{ secrets.BUNNY_STORAGE_PASSWORD }}"
          pullZoneId: 4891065
          upload: "true"
          remove: "false"
          purgePullZone: "true"
          purgePullZoneDelay: "5"
          maxRetries: "5"
